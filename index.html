<style>
  :root{
    --page:#0a0a0d;
    --surface-1:#17171b;
    --surface-2:#1e1e23;
    --surface-3:#26262d;
    --text-primary:#ffffff;
    --text-secondary:#c7c6d6;
    --text-muted:#8b8a9a;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --grid:#26262e;
    --baseline:#3a3a44;

    --accent-blue:#0088FF;
    --accent-orange:#FF9900;
    --accent-aqua:#22c98e;
    --accent-yellow:#e0ab1f;
    --accent-magenta:#ff6fa8;
    --accent-violet:#a78bfa;
    --accent-red:#ff6b6b;

    --status-good:#2fd66c;
    --status-warning:#fbbf24;
    --status-serious:#fb923c;
    --status-critical:#fb5858;

    --grad-primary: linear-gradient(135deg, #0088FF 0%, #4aa8ff 55%, #FF9900 120%);
    --grad-good: linear-gradient(135deg, #22c98e 0%, #2fd66c 100%);
    --grad-bad: linear-gradient(135deg, #fb5858 0%, #FF9900 100%);
    --shadow-card: 0 1px 0 0 rgba(255,255,255,0.05) inset, 0 14px 32px -12px rgba(0,0,0,0.65);
    --shadow-card-hover: 0 1px 0 0 rgba(255,255,255,0.07) inset, 0 20px 44px -14px rgba(0,0,0,0.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(0,136,255,0.16), transparent 60%),
      radial-gradient(900px 560px at 88% 6%, rgba(167,139,250,0.14), transparent 62%),
      radial-gradient(1000px 620px at 25% 105%, rgba(34,201,142,0.10), transparent 60%),
      radial-gradient(800px 500px at 95% 95%, rgba(255,111,168,0.08), transparent 60%),
      var(--page);
    background-attachment:fixed;
  }
  #root{min-height:100vh;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#33333c;}
  ::selection{ background:rgba(0,136,255,0.35); }

  @keyframes fadeInUp{ from{ opacity:0; } to{ opacity:1; } }
  .tab-content{ animation:fadeInUp .32s ease both; }

  .app{ display:flex; min-height:100vh; background:transparent; }

  /* Sidebar */
  .sidebar{
    width:230px; flex:0 0 230px;
    background:linear-gradient(180deg, rgba(30,30,36,0.92), rgba(20,20,24,0.92));
    backdrop-filter:blur(14px);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:20px 14px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 10px 22px; }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:var(--grad-primary);
    box-shadow:0 6px 18px -4px rgba(0,136,255,0.55);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#fff;flex:0 0 auto;
  }
  .brand-text{ line-height:1.1; }
  .brand-text .t1{ font-size:14px; font-weight:700; color:var(--text-primary); }
  .brand-text .t2{ font-size:11px; color:var(--text-muted); }

  .nav{ display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .nav-item{
    position:relative;
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px;
    color:var(--text-secondary); font-size:13.5px; font-weight:500;
    cursor:pointer; border:1px solid transparent; user-select:none;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--text-primary); transform:translateX(1px); }
  .nav-item.active{
    background:linear-gradient(135deg, rgba(0,136,255,0.20), rgba(167,139,250,0.14));
    border-color:rgba(0,136,255,0.38);
    color:#fff;
    box-shadow:0 6px 16px -6px rgba(0,136,255,0.35);
  }
  .nav-item.active::before{
    content:""; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
    width:3px; height:16px; border-radius:3px; background:var(--grad-primary);
  }
  .nav-icon{ width:18px; height:18px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:inherit; }
  .nav-item.active .nav-icon svg{ stroke:var(--accent-blue); }
  .nav-item .nav-icon svg{ stroke:var(--text-muted); transition:stroke .15s ease; }
  .nav-item:hover .nav-icon svg{ stroke:var(--text-primary); }
  .nav-item.active .nav-icon svg{ stroke:var(--accent-blue); }

  .sidebar-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); }
  .reset-btn{
    width:100%; background:transparent; border:1px solid var(--border);
    color:var(--text-muted); font-size:11.5px; padding:8px 10px;
    border-radius:8px; cursor:pointer; text-align:left;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .reset-btn:hover{ color:var(--text-secondary); border-color:var(--border-strong); background:var(--surface-2); }

  /* Main */
  .main{ flex:1; min-width:0; padding:26px 32px 40px; max-width:1400px; }
  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
  .page-title{
    font-size:21px; font-weight:800; margin:0; letter-spacing:-.01em;
    background:linear-gradient(135deg, #ffffff 20%, #cdd8ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .page-sub{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topbar-date{
    font-size:11.5px; color:var(--text-secondary); font-weight:600;
    background:var(--surface-1); border:1px solid var(--border);
    padding:7px 13px; border-radius:99px; white-space:nowrap;
  }

  /* Currency control */
  .currency-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rate-group{
    display:flex; align-items:center; gap:6px;
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:99px; padding:5px 6px 5px 13px;
  }
  .rate-label{ font-size:11.5px; color:var(--text-muted); font-weight:600; white-space:nowrap; }
  .currency-active-label{ font-size:11px; color:var(--text-muted); font-weight:600; white-space:nowrap; }
  .rate-input{
    width:78px; padding:5px 8px; font-size:12.5px; border-radius:99px;
    background:var(--surface-2); text-align:right;
  }
  .seg-toggle{
    display:flex; background:var(--surface-1); border:1px solid var(--border);
    border-radius:99px; padding:3px; gap:2px;
  }
  .seg-btn{
    background:transparent; border:none; color:var(--text-muted);
    font-size:11.5px; font-weight:700; padding:6px 14px; border-radius:99px;
    cursor:pointer; transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .seg-btn:hover{ color:var(--text-secondary); }
  .seg-btn.active{
    background:var(--grad-primary); color:#fff;
    box-shadow:0 4px 14px -3px rgba(0,136,255,0.55);
  }

  /* KPI cards */
  .kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px; }
  @media (max-width:1000px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
  .card{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0)) , var(--surface-1);
    border:1px solid var(--border);
    border-radius:16px; padding:18px 18px 16px;
    box-shadow:var(--shadow-card);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--border-strong); box-shadow:var(--shadow-card-hover); }
  .kpi-card{ display:flex; flex-direction:column; gap:10px; }
  .kpi-card::before{
    content:""; position:absolute; top:0; left:18px; right:18px; height:3px;
    border-radius:0 0 8px 8px; background:var(--kpi-accent, var(--accent-blue)); opacity:.9;
  }
  .kpi-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .kpi-label{ font-size:11.5px; color:var(--text-muted); font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .kpi-icon{
    width:36px;height:36px;border-radius:10px; flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px -3px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  .kpi-value{
    font-size:27px; font-weight:800; letter-spacing:-.01em;
    background:linear-gradient(135deg, #ffffff, #d7e3ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .kpi-delta{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; }
  .kpi-delta.good{ color:var(--status-good); }
  .kpi-delta.bad{ color:var(--status-critical); }
  .kpi-delta .kpi-delta-note{ color:var(--text-muted); font-weight:500; }
  .kpi-caption{ font-size:12px; color:var(--text-muted); }

  /* Charts row */
  .charts-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; }
  @media (max-width:1050px){ .charts-grid{ grid-template-columns:1fr; } }
  .chart-card{ position:relative; }
  .chart-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  .chart-title{ font-size:14.5px; font-weight:700; }
  .chart-sub{ font-size:11.5px; color:var(--text-muted); margin-bottom:10px; }
  .chart-wrap{ position:relative; width:100%; }
  .tooltip{
    position:absolute; pointer-events:none; z-index:5;
    background:linear-gradient(180deg, #2c2c35, #222228);
    border:1px solid var(--border-strong);
    border-radius:9px; padding:7px 11px; font-size:12px; line-height:1.4;
    box-shadow:0 10px 26px rgba(0,0,0,.55);
    transform:translate(-50%,-100%); white-space:nowrap;
  }
  .tooltip .tt-label{ color:var(--text-muted); font-size:10.5px; margin-bottom:2px; }
  .tooltip .tt-value{ color:var(--text-primary); font-weight:700; }
  .legend-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-secondary); }
  .legend-dot{ width:9px; height:9px; border-radius:3px; flex:0 0 auto; box-shadow:0 0 8px -1px currentColor; }

  /* Tabs generic section spacing */
  .section{ margin-bottom:22px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .panel-title{ font-size:15px; font-weight:700; }
  .panel-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }

  /* Forms */
  .form-card{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:120px; }
  .field.grow{ flex:1; min-width:160px; }
  .field label{ font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  .input, .select{
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-primary); border-radius:9px; padding:9px 10px;
    font-size:13px; outline:none; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus, .select:focus{ border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(0,136,255,0.18); }
  .btn{
    background:var(--grad-primary); color:#fff; border:none; border-radius:9px;
    padding:10px 17px; font-size:13px; font-weight:700; cursor:pointer;
    white-space:nowrap; box-shadow:0 8px 20px -6px rgba(0,136,255,0.55);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.08); box-shadow:0 10px 24px -6px rgba(0,136,255,0.65); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; transform:none; filter:none; }
  .btn:disabled:hover{ transform:none; filter:none; box-shadow:none; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text-secondary); box-shadow:none; }
  .btn.ghost:hover{ border-color:var(--border-strong); color:var(--text-primary); transform:none; filter:none; }
  .btn.danger-ghost{ background:transparent; border:1px solid transparent; color:var(--text-muted); padding:6px; box-shadow:none; }
  .btn.danger-ghost:hover{ color:var(--status-critical); transform:none; filter:none; }

  /* Tables */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; font-size:11px; color:var(--text-muted); font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; padding:0 12px 10px; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ transition:background .12s ease; }
  tbody tr:hover{ background:var(--surface-2); }
  tfoot .log-totals-row td{ padding:11px 12px; border-top:2px solid var(--border-strong); border-bottom:none; background:var(--surface-2); }
  tfoot .log-totals-row:hover td{ background:var(--surface-2); }
  .cell-company{ font-weight:600; color:var(--text-primary); }
  .cell-sub{ font-size:11.5px; color:var(--text-muted); margin-top:1px; }
  .value-input{ width:110px; }
  .stage-select{ min-width:130px; }
  .role-select{ min-width:110px; }
  .stage-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
    padding:4px 9px; border-radius:99px; border:1px solid var(--border-strong);
  }
  .stage-dot{ width:7px; height:7px; border-radius:50%; box-shadow:0 0 6px -1px currentColor; }
  .num-input{ width:80px; }
  .score-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:46px; padding:4px 9px; border-radius:8px; font-weight:800; font-size:12.5px;
    border:1px solid transparent;
  }

  .tag-muted{ color:var(--text-muted); font-size:12px; }

  /* Pipeline table extras */
  .panel-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .panel-alert{ color:var(--status-warning); font-weight:700; }
  .quota-scope-banner{
    background:rgba(0,136,255,0.1); border:1px solid rgba(0,136,255,0.3);
    border-radius:10px; padding:10px 14px; color:var(--text-secondary);
  }
  .lead-row{ cursor:pointer; }
  .priority-badge{
    display:inline-flex; align-items:center; font-size:11.5px; font-weight:700;
    padding:4px 10px; border-radius:99px; border:1px solid var(--border-strong);
  }
  .followup-cell{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:12.5px; }
  .winprob-pill{ display:inline-flex; align-items:center; gap:8px; }
  .winprob-track{
    position:relative; width:52px; height:6px; border-radius:99px;
    background:var(--surface-2); border:1px solid var(--border); overflow:hidden;
  }
  .winprob-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .2s ease; }
  .winprob-text{ font-size:11.5px; font-weight:800; min-width:32px; }

  .alert-badge{

  /* Slide-out lead drawer */
  @keyframes backdropIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes drawerIn{ from{ transform:translateX(100%); } to{ transform:translateX(0); } }
  .drawer-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(6,6,9,0.62); backdrop-filter:blur(2px);
    animation:backdropIn .2s ease both;
    display:flex; justify-content:flex-end;
  }
  /* Centered confirm modal (e.g. "re-enter your password to remove a user") —
     reuses .drawer-overlay's backdrop but centers a small card instead of a
     full-height side panel. */
  @keyframes confirmModalIn{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:scale(1); } }
  .confirm-modal-overlay{ justify-content:center; align-items:center; padding:20px; }
  .confirm-modal{
    width:min(420px, 100%); max-height:90vh; overflow-y:auto;

    box-shadow:0 30px 70px -20px rgba(0,0,0,0.75);

  .drawer-close{

  }

    border-bottom:1px solid var(--border); flex-wrap:wrap;

  .quick-action.disabled{ opacity:.4; cursor:not-allowed; pointer-events:none; }

  }

    background:transparent; border:none; color:var(--text-muted);
    font-size:12.5px; font-weight:700; padding:10px 14px; cursor:pointer;

    transition:color .15s ease, border-color .15s ease;
  }

  .drawer-body{ flex:1; overflow-y:auto; padding:20px 22px 8px; }
  .drawer-panel{ display:flex; flex-direction:column; gap:6px; }
  .field-group-title{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    color:var(--accent-blue); margin:16px 0 10px;
  }
  .field-group-title:first-child{ margin-top:2px; }
  .drawer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  @media (max-width:520px){ .drawer-grid{ grid-template-columns:1fr; } }
  .textarea-field{ margin-bottom:16px; }
  .textarea{
    width:100%; resize:vertical; min-height:90px; line-height:1.5;
    font-family:inherit; margin-top:6px;
    background:var(--surface-2); border:1px solid var(--border);
    color:var(--text-primary); border-radius:9px; padding:10px 12px;
    font-size:13px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  .textarea-lg{ min-height:150px; }
  .add-note-btn{ margin-top:10px; }

  .interaction-text{ font-size:13px; color:var(--text-secondary); line-height:1.5; white-space:pre-wrap; }
  .interaction-del{ flex:0 0 auto; }

    padding:14px 22px; border-top:1px solid var(--border);

  }

  .drawer-delete:hover{ color:var(--status-critical); border-color:rgba(251,88,88,0.4); background:rgba(251,88,88,0.08); }

  /* ---------------------------------------------------------------- */
  /* LeadForge additions                                               */
  /* ---------------------------------------------------------------- */

  .app-shell{ display:flex; min-height:100vh; background:transparent; }

  /* Sidebar brand image + collapse */
  .brand-mark-img{ width:34px; height:34px; border-radius:10px; flex:0 0 auto; object-fit:contain; }
  .sidebar{ transition:width .2s ease, flex-basis .2s ease, padding .2s ease; }

  .alerts-banner{ margin-bottom:22px; }

  .alerts-icon{ color:var(--status-warning); display:flex; }
  .alerts-banner-title{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .alerts-banner-sub{ font-size:11.5px; color:var(--text-muted); font-weight:600; }

    content:""; position:absolute; top:0; left:18px; right:18px; height:3px;

  /* Drawer field labels (used as flex column with input/select inside) */

  /* ---------------------------------------------------------------- */
  /* Splash screen                                                     */
  /* ---------------------------------------------------------------- */
  @keyframes splashFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  @keyframes splashLogoPulse{
    0%,100%{ filter:drop-shadow(0 0 18px rgba(0,136,255,0.55)); transform:scale(1); }
    50%{ filter:drop-shadow(0 0 34px rgba(255,153,0,0.6)); transform:scale(1.035); }

  @keyframes splashWordmarkIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes sparkFloat{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }

    100%{ opacity:0; transform:translateY(-40px) scale(0.4); }

  .splash{
    position:fixed; inset:0; z-index:1000;

      radial-gradient(900px 600px at 50% 30%, rgba(0,136,255,0.20), transparent 60%),

  .splash-tagline{

  .splash-credit{

  /* ---------------------------------------------------------------- */
  @keyframes welcomeRingSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes welcomeAvatarPulse{

  @keyframes welcomeScanFill{ from{ width:0%; } to{ width:100%; } }
  .welcome-screen{
    position:fixed; inset:0; z-index:1000;
    background:
      radial-gradient(900px 600px at 50% 28%, rgba(0,136,255,0.18), transparent 60%),
      radial-gradient(700px 500px at 68% 78%, rgba(255,153,0,0.14), transparent 60%),

  /* ---------------------------------------------------------------- */
  /* Authentication & role management                                 */
  /* ---------------------------------------------------------------- */

  .login-shell{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(0,136,255,0.16), transparent 60%),
      radial-gradient(900px 560px at 88% 6%, rgba(255,153,0,0.12), transparent 62%),
      var(--page);
    overflow:hidden; padding:24px;
  }
  .login-glow{
    position:absolute; width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,136,255,0.16), transparent 70%);
    filter:blur(10px); top:-10%; left:50%; transform:translateX(-50%);
  }
  .login-card{
    position:relative; z-index:2; width:100%; max-width:420px;
    background:linear-gradient(180deg, rgba(30,30,36,0.92), rgba(18,18,22,0.94));
    border:1px solid var(--border-strong); border-radius:20px;
    padding:32px 30px 28px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.75), 0 1px 0 0 rgba(255,255,255,0.06) inset;
  }
  .login-brand{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .login-logo{ width:44px; height:44px; border-radius:12px; object-fit:contain; flex:0 0 auto; }
  .login-brand-title{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
  .login-brand-tagline{ font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:.03em; }
  .login-heading{
    display:flex; align-items:center; gap:8px; color:var(--text-secondary);
    font-size:13px; font-weight:700; margin-bottom:16px;
  }
  .login-heading svg{ color:var(--accent-blue); }
  .login-form{ display:flex; flex-direction:column; gap:14px; }
  .login-field{ display:flex; flex-direction:column; gap:6px; font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  .login-field .input{ text-transform:none; font-weight:400; }
  .login-error{
    background:rgba(251,88,88,0.12); border:1px solid rgba(251,88,88,0.35);
    color:var(--status-critical); font-size:12.5px; font-weight:600;
    padding:9px 12px; border-radius:9px;
  }
  .login-submit{ width:100%; margin-top:2px; padding:11px 17px; }
  .login-notice{
    background:rgba(0,136,255,0.1); border:1px solid rgba(0,136,255,0.3);
    color:var(--text-secondary); font-size:12px; font-weight:600; line-height:1.5;
    padding:10px 12px; border-radius:9px; margin-bottom:14px;
  }
  .login-link-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:18px; gap:10px;
  }
  .login-link-row-center{ justify-content:center; }
  .login-link{
    background:transparent; border:none; padding:0; cursor:pointer;
    color:var(--accent-blue); font-size:12px; font-weight:700;
  }
  .login-link:hover{ text-decoration:underline; }
  .reset-link-box{ display:flex; flex-direction:column; gap:14px; }
  .reset-link-btn{ display:flex; align-items:center; justify-content:center; text-decoration:none; }

  /* Optional Face ID checkbox + capture step (registration & Settings) */
  .login-checkbox-row{
    display:flex; align-items:flex-start; gap:9px; padding:10px 12px;
    background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
    cursor:pointer;
  }
  .login-checkbox-row input[type="checkbox"]{ width:16px; height:16px; margin-top:1px; flex:0 0 auto; accent-color:var(--accent-blue); cursor:pointer; }
  .login-checkbox-label{ display:flex; flex-direction:column; gap:2px; text-transform:none; }
  .login-checkbox-title{ font-size:12.5px; font-weight:700; color:var(--text-primary); }
  .login-checkbox-sub{ font-size:11px; font-weight:500; color:var(--text-muted); text-transform:none; letter-spacing:0; line-height:1.4; }
  .face-capture-wrap{ display:flex; flex-direction:column; gap:14px; }
  .face-instructions{ font-size:12.5px; color:var(--text-secondary); line-height:1.5; text-align:center; }
  .face-video-frame{
    position:relative; width:100%; aspect-ratio:4/3; max-width:320px; margin:0 auto;
    border-radius:16px; overflow:hidden; background:#0b0b0e;
    border:2px solid var(--border-strong);
  }
  .face-video-frame.face-detecting{ border-color: var(--accent-blue); box-shadow:0 0 0 3px rgba(0,136,255,0.18); }
  .face-video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block; }
  .face-video-overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(10,10,12,0.72); color:var(--text-secondary); font-size:12px; font-weight:600;
    text-align:center; padding:0 16px; gap:8px; flex-direction:column;
  }
  .face-status{
    font-size:12px; font-weight:600; text-align:center; padding:8px 12px; border-radius:9px;
  }
  .face-status.ok{ background:rgba(63,185,80,0.12); color:#3fb950; border:1px solid rgba(63,185,80,0.35); }
  .face-status.err{ background:rgba(251,88,88,0.12); color:var(--status-critical); border:1px solid rgba(251,88,88,0.35); }
  .face-action-row{ display:flex; gap:10px; }
  .face-action-row .btn{ flex:1; justify-content:center; }
  .face-privacy-note{ font-size:10.5px; color:var(--text-muted); text-align:center; line-height:1.5; }

  /* Settings / My Profile tab */
  .settings-card{ max-width:560px; }
  .settings-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 0; border-bottom:1px solid var(--border);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row-label{ font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  .settings-row-value{ font-size:13px; color:var(--text-primary); font-weight:600; }
  .face-status-pill{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    padding:4px 10px; border-radius:99px; border:1px solid transparent;
  }
  .face-status-pill.enabled{ background:rgba(63,185,80,0.14); color:#3fb950; border-color:rgba(63,185,80,0.4); }
  .face-status-pill.disabled{ background:rgba(139,138,154,0.14); color:var(--text-muted); border-color:rgba(139,138,154,0.3); }

  /* My Profile — photo + editable details */
  .profile-card{ padding:24px; }
  .profile-photo-row{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .profile-photo-wrap{ position:relative; width:88px; height:88px; flex:0 0 auto; }
  .profile-photo{
    width:88px; height:88px; border-radius:50%; object-fit:cover;
    background:var(--grad-primary); color:#fff; font-weight:800; font-size:28px; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border-strong); box-shadow:0 0 0 4px var(--surface-2);
  }
  .profile-photo-fallback{ display:flex; align-items:center; justify-content:center; }
  .profile-photo-edit-btn{
    position:absolute; right:-4px; bottom:-4px; width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit;
    background:var(--grad-primary); color:#fff; border:2px solid var(--surface-1);
    box-shadow:0 4px 12px -2px rgba(0,136,255,0.6); transition:transform .15s ease;
  }
  .profile-photo-edit-btn:hover{ transform:scale(1.08); }
  .profile-photo-actions{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .profile-photo-name{ font-size:16px; font-weight:800; color:var(--text-primary); }
  .profile-photo-buttons{ display:flex; align-items:center; gap:8px; }
  .profile-photo-hint{ font-size:11.5px; color:var(--text-muted); }
  .settings-form-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; margin-bottom:6px; padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .settings-form-grid label{ display:flex; flex-direction:column; gap:6px; font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  @media (max-width:560px){ .settings-form-grid{ grid-template-columns:1fr; } }
  .settings-status{
    margin-top:14px; font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:8px;
  }
  .settings-status.is-ok{ background:rgba(63,185,80,0.12); color:#3fb950; }
  .settings-status.is-error{ background:rgba(251,88,88,0.12); color:var(--status-critical); }
  .settings-save-row{ display:flex; justify-content:flex-end; margin-top:16px; }

  /* Role badges */
  .role-badge{
    display:inline-flex; align-items:center; font-size:10px; font-weight:800;
    padding:2px 8px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em;
    border:1px solid transparent; white-space:nowrap;
  }
  .role-admin{ background:rgba(255,153,0,0.16); color:var(--accent-orange); border-color:rgba(255,153,0,0.4); }
  .role-rep{ background:rgba(0,136,255,0.14); color:var(--accent-blue); border-color:rgba(0,136,255,0.4); }

  /* Floating profile FAB — pinned to the top-right corner of the viewport,
     replaces the old inline name+role+logout chip with a single sleek icon.
     Click navigates straight to User Management (Admin) or My Profile (Rep);
     logging out still lives on the Sidebar's own Log Out button. */
  @keyframes fabRingPulse{
    0%,100%{ transform:scale(1); opacity:.6; }
    50%{ transform:scale(1.16); opacity:0; }
  }
  .profile-fab{
    position:fixed; top:20px; right:30px; z-index:150;
    width:46px; height:46px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, rgba(0,136,255,0.24), rgba(11,15,23,0.94));
    border:1px solid rgba(0,136,255,0.42); cursor:pointer; font-family:inherit;
    box-shadow:0 0 0 1px rgba(0,136,255,0.14), 0 10px 26px -10px rgba(0,136,255,0.55);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .profile-fab:hover{
    transform:translateY(-2px) scale(1.05);
    box-shadow:0 0 0 1px rgba(0,136,255,0.28), 0 14px 32px -8px rgba(0,136,255,0.7);
    border-color:rgba(0,136,255,0.75);
  }
  .profile-fab.is-admin{
    background:linear-gradient(145deg, rgba(255,153,0,0.24), rgba(11,15,23,0.94));
    border-color:rgba(255,153,0,0.46);
    box-shadow:0 0 0 1px rgba(255,153,0,0.16), 0 10px 26px -10px rgba(255,153,0,0.55);
  }
  .profile-fab.is-admin:hover{
    box-shadow:0 0 0 1px rgba(255,153,0,0.3), 0 14px 32px -8px rgba(255,153,0,0.72);
    border-color:rgba(255,153,0,0.8);
  }
  .profile-fab-ring{
    position:absolute; inset:-6px; border-radius:50%; pointer-events:none;
    border:1.5px solid rgba(0,136,255,0.4);
    animation:fabRingPulse 2.6s ease-in-out infinite;
  }
  .profile-fab.is-admin .profile-fab-ring{ border-color:rgba(255,153,0,0.4); }
  .profile-fab-avatar{
    width:33px; height:33px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--grad-primary); color:#fff; font-weight:800; font-size:12px; letter-spacing:.02em;
  }
  .profile-fab-photo{ object-fit:cover; background:#0B0F17; }

  /* Locked rep chip (Sales Rep header, replaces the rep selector) */
  .locked-rep-chip{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary);
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:99px; padding:9px 16px 9px 14px; font-weight:600;
  }
  .locked-rep-chip strong{ color:var(--text-primary); font-weight:700; }

  /* Sidebar logout button */
  .logout-btn{ margin-top:8px; }
  .logout-btn:hover{ color:var(--status-critical); border-color:rgba(251,88,88,0.4); background:rgba(251,88,88,0.08); }

  /* ---------------------------------------------------------------- */
  /* Archive / Recycle Bin                                            */
  /* ---------------------------------------------------------------- */

  .pipeline-view-toggle{ margin-bottom:14px; display:inline-flex; }
  .pipeline-view-toggle .seg-btn{ display:inline-flex; align-items:center; gap:5px; }
  .bin-notice{
    font-size:12px; color:var(--text-muted); background:var(--surface-1);
    border:1px solid var(--border); border-radius:9px; padding:9px 14px; margin-bottom:14px;
  }
  .lead-row-bin{ cursor:default; }
  .lead-row-bin:hover{ background:transparent; }
  .btn.danger-solid{
    background:linear-gradient(135deg, #fb5858, #d93b3b); color:#fff; border:none;
    box-shadow:0 6px 16px -4px rgba(251,88,88,0.55);
  }
  .btn.danger-solid:hover{ transform:translateY(-1px); filter:brightness(1.08); }

  /* ---------------------------------------------------------------- */
  /* Select-all checkboxes + bulk actions                             */
  /* ---------------------------------------------------------------- */

  .th-checkbox{ width:34px; padding-right:0 !important; }
  .row-checkbox{ width:16px; height:16px; cursor:pointer; accent-color:var(--accent-blue); }
  .lead-row-selected{ background:rgba(0,136,255,0.07); }
  .lead-row-selected:hover{ background:rgba(0,136,255,0.11); }
  .bulk-action-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:10px 14px;
    background:var(--surface-1); border:1px solid var(--border-strong); border-radius:10px;
    animation:bulkBarIn .15s ease;
  }
  @keyframes bulkBarIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  .bulk-action-count{ font-size:13px; font-weight:700; color:var(--text-primary); }
  .bulk-action-spacer{ flex:1; }

  /* ---------------------------------------------------------------- */
  /* Online / offline connectivity indicator                          */
  /* ---------------------------------------------------------------- */

  .sync-status{
    display:flex; align-items:center; gap:8px; padding:8px 10px; margin-bottom:10px;
    border-radius:8px; font-size:12px; font-weight:700; border:1px solid var(--border);
    background:var(--surface-1);
  }
  .sync-status-icon{ display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .sync-status-icon.spin{ animation:syncSpin 1.1s linear infinite; }
  @keyframes syncSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .sync-status-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sync-status-online{ color:var(--status-good); border-color:rgba(47,214,108,0.35); background:rgba(47,214,108,0.08); }
  .sync-status-offline{ color:var(--status-critical); border-color:rgba(251,88,88,0.35); background:rgba(251,88,88,0.08); }
  .sync-status-syncing{ color:var(--accent-orange); border-color:rgba(255,153,0,0.35); background:rgba(255,153,0,0.08); }
  .sidebar.collapsed .sync-status{ justify-content:center; padding:8px; }

  /* ---------------------------------------------------------------- */
  /* Business Units & Target Allocation module                        */
  /* ---------------------------------------------------------------- */

  .kpi-grid{ grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
  .target-amount-input{ width:150px; }
  .bu-name-input{ min-width:170px; }

  .chart-legend{ display:flex; gap:14px; flex-wrap:wrap; }
  .chart-legend-item{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--text-secondary); }
  .chart-legend-dot{ width:9px; height:9px; border-radius:99px; display:inline-block; }

  .target-progress{ display:inline-flex; align-items:center; gap:8px; width:100%; }
  .target-progress-track{
    position:relative; flex:1; min-width:40px; height:8px; border-radius:99px;
    background:var(--surface-2); border:1px solid var(--border); overflow:hidden;
  }
  .target-progress-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .2s ease; }
  .target-progress-overflow-mark{
    position:absolute; right:0; top:-1px; bottom:-1px; width:2px; background:var(--text-primary); opacity:.6;
  }
  .target-progress-text{ font-size:11.5px; font-weight:800; min-width:36px; text-align:right; }

  .target-status-badge{
    display:inline-flex; align-items:center; font-size:11px; font-weight:800;
    padding:3px 10px; border-radius:99px; border:1px solid var(--border-strong); white-space:nowrap;
  }

  .quota-card{ display:flex; flex-direction:column; gap:14px; }
  .quota-card-head{ display:flex; align-items:center; gap:10px; }
  .quota-period{ display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px solid var(--border); }
  .quota-period:first-of-type{ padding-top:0; border-top:none; }
  .quota-period-label{ font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:8px; }
  .quota-period-figures{ font-size:16px; font-weight:800; color:var(--text-primary); }
  .quota-of{ font-size:11.5px; font-weight:600; color:var(--text-muted); }
  .quota-remaining{ font-size:12px; font-weight:700; }

  /* ---------------------------------------------------------------- */
  /* Lead Drawer — primary Add/Save action bar                        */
  /* ---------------------------------------------------------------- */
  .drawer-save-bar{
    padding:14px 22px; border-top:1px solid var(--border);
    background:rgba(0,136,255,0.05);
  }
  .drawer-save-btn{ width:100%; justify-content:center; display:flex; align-items:center; font-size:14px; padding:12px 17px; }

  /* ---------------------------------------------------------------- */
  /* Message Center — header mail icon + admin/rep messaging panel    */
  /* ---------------------------------------------------------------- */
  .message-center{ position:relative; }
  .message-toggle-btn{
    position:relative; width:38px; height:38px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border-radius:11px; cursor:pointer; font-family:inherit;
    background:linear-gradient(160deg, rgba(0,136,255,0.16), rgba(0,136,255,0.06));
    border:1px solid rgba(0,136,255,0.28); color:var(--accent-blue);
    transition:background .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .message-toggle-btn svg{ width:18px; height:18px; }
  .message-toggle-btn:hover{
    background:linear-gradient(160deg, rgba(0,136,255,0.26), rgba(0,136,255,0.1));
    border-color:rgba(0,136,255,0.5);
    transform:translateY(-1px);
    box-shadow:0 8px 18px -8px rgba(0,136,255,0.5);
  }
  @keyframes mailFlash{
    0%, 100% { box-shadow:0 0 0 0 rgba(251,88,88,0.55); border-color:rgba(251,88,88,0.5); color:var(--status-critical); }
    50% { box-shadow:0 0 0 6px rgba(251,88,88,0); border-color:rgba(251,88,88,0.9); color:var(--status-critical); }
  }
  .message-toggle-btn.has-unread{ animation:mailFlash 1.4s ease-in-out infinite; }
  .message-badge{
    position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px;
    border-radius:99px; background:var(--status-critical); color:#fff;
    font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface-1, #14141a); line-height:1;
  }
  .message-panel{
    position:absolute; top:calc(100% + 10px); right:0; z-index:200;
    width:396px; max-height:74vh; overflow-y:auto;
    background:linear-gradient(180deg, rgba(26,26,31,0.99), rgba(18,18,22,0.99));
    border:1px solid var(--border-strong); border-radius:14px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.6);
    padding:18px;
    display:flex; flex-direction:column;
  }
  .message-panel-head{ font-size:14px; font-weight:800; margin-bottom:14px; }

  /* Tab bar — the fix for the old "everything stacked in one column" feel:
     only the active tab's section renders below, so Admin and Sales Reps
     each see one focused thing at a time instead of a long scroll. */
  .message-tabs{
    display:flex; gap:4px; padding:3px; margin-bottom:14px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  }
  .message-tab{
    flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 6px; border-radius:8px; border:none; background:transparent;
    font-size:12px; font-weight:700; color:var(--text-secondary); cursor:pointer;
    transition:background .15s ease, color .15s ease; white-space:nowrap;
  }
  .message-tab:hover{ color:var(--text-primary); }
  .message-tab.active{ background:var(--accent-blue); color:#fff; box-shadow:0 4px 10px -2px rgba(0,136,255,0.5); }
  .message-tab-badge{
    min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--status-critical); color:#fff;
    font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; line-height:1;
  }
  .message-tab.active .message-tab-badge{ background:rgba(255,255,255,0.28); }

  .message-compose{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .message-compose-input{ min-height:70px; }
  .message-send-btn{ align-self:flex-end; display:flex; align-items:center; }
  .message-list{ display:flex; flex-direction:column; gap:10px; }
  .message-item{
    background:var(--surface-2); border:1px solid var(--border); border-radius:11px;
    padding:10px 12px; border-left:2px solid var(--border-strong);
  }
  .message-item.unread{ border-left-color:var(--accent-blue); background:rgba(0,136,255,0.08); }
  .message-new-dot{
    display:inline-block; width:7px; height:7px; border-radius:99px; background:var(--status-critical);
    margin-left:6px; vertical-align:middle; flex:0 0 auto;
  }
  .message-item-head{ display:flex; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .message-item-time-group{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .message-delete-btn{
    background:transparent; border:none; color:var(--text-muted); cursor:pointer;
    padding:3px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    transition:color .15s ease, background .15s ease;
  }
  .message-delete-btn:hover{ color:var(--status-critical); background:rgba(251,88,88,0.14); }
  .message-delete-btn svg{ width:13px; height:13px; }

  /* ---------------------------------------------------------------- */
  /* Home screen — feature-picker landing page                        */
  /* ---------------------------------------------------------------- */
  .home-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
  .home-card{
    display:flex; align-items:center; gap:16px; text-align:left;
    background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0)) , var(--surface-1);
    border:1px solid var(--border); border-radius:16px;
    padding:20px; cursor:pointer; font-family:inherit; color:inherit; width:100%;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .home-card:hover{
    transform:translateY(-2px);
    border-color:var(--home-accent);
    box-shadow:0 14px 34px -14px var(--home-accent-shadow);
  }
  .home-card-icon{
    flex:0 0 auto; width:48px; height:48px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:var(--home-accent-bg); color:var(--home-accent);
    box-shadow:0 0 0 1px var(--home-accent-shadow) inset;
  }
  .home-card-icon svg{ width:22px; height:22px; }
  .home-card-body{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .home-card-title{ font-size:15px; font-weight:800; color:var(--text-primary); }
  .home-card-desc{ font-size:12.5px; color:var(--text-muted); line-height:1.4; }
  .home-card-arrow{
    flex:0 0 auto; color:var(--text-muted);
    transition:transform .15s ease, color .15s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .home-card:hover .home-card-arrow{ color:var(--home-accent); transform:translateX(3px); }
  @media (max-width:600px){
    .home-grid{ grid-template-columns:1fr; }
    .home-card{ padding:16px; gap:12px; }
  }
  .message-item-to{ font-size:11px; font-weight:700; color:var(--text-secondary); }
  .message-item-time{ font-size:10.5px; color:var(--text-muted); white-space:nowrap; }
  .message-item-body{ font-size:13px; color:var(--text-primary); line-height:1.5; white-space:pre-wrap; }
  .message-item-reads{ font-size:10.5px; color:var(--text-muted); margin-top:6px; font-weight:700; }
  .message-thread{ max-height:260px; overflow-y:auto; padding-right:2px; }
  .message-bubble{
    border-radius:11px; padding:9px 11px; font-size:13px; max-width:88%;
  }
  .message-bubble.from-them{
    background:rgba(0,136,255,0.14); border:1px solid rgba(0,136,255,0.3);
    align-self:flex-start; margin-right:auto;
  }
  .message-bubble.from-me{
    background:var(--surface-2); border:1px solid var(--border);
    align-self:flex-end; margin-left:auto;
  }
  .message-thread.message-list{ display:flex; }
  .message-reply-box{ display:flex; flex-direction:column; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .message-peer-select{ width:100%; }

  /* Admin's Team Inbox — conversation list, one row per rep. */
  .message-conv-list{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; padding-right:2px; }
  .message-conv-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--surface-2); border:1px solid var(--border); border-radius:11px;
    padding:9px 11px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
    font-family:inherit; color:inherit;
  }
  .message-conv-row:hover{ border-color:var(--accent-blue); }
  .message-conv-row.unread{ border-color:rgba(0,136,255,0.5); background:rgba(0,136,255,0.08); }
  .message-conv-avatar{
    flex:0 0 auto; width:32px; height:32px; border-radius:99px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:#fff; letter-spacing:.02em;
  }
  .message-conv-info{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .message-conv-name{ font-size:13px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; }
  .message-conv-preview{ font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .message-conv-time{ flex:0 0 auto; font-size:10.5px; color:var(--text-muted); white-space:nowrap; }

  /* Admin's Team Inbox — a single open conversation. */
  .message-conv-open{ display:flex; flex-direction:column; }
  .message-conv-back{
    align-self:flex-start; background:none; border:none; cursor:pointer; padding:0 0 12px;
    font-size:12px; font-weight:700; color:var(--accent-blue); font-family:inherit;
  }
  .message-conv-back:hover{ text-decoration:underline; }
  .message-conv-open-head{
    display:flex; align-items:center; gap:10px; font-size:14px; font-weight:800; color:var(--text-primary); margin-bottom:12px;
  }


  /* ------------------------------------------------------------------ */
  /* Responsive layout — off-canvas sidebar + tighter spacing on        */
  /* tablet/phone widths. Desktop layout (>860px) is completely         */
  /* unaffected by anything in this block.                              */
  /* ------------------------------------------------------------------ */
  .mobile-topbar{ display:none; }
  .sidebar-backdrop{ display:none; }

  @media (max-width:860px){
    .mobile-topbar{
      display:flex; align-items:center; gap:10px;
      position:sticky; top:0; z-index:120;
      padding:12px 16px; margin:0 0 16px; box-sizing:border-box;
      background:linear-gradient(180deg, rgba(20,20,24,0.97), rgba(20,20,24,0.92));
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      border-radius:12px;
    }
    .mobile-menu-btn{
      background:var(--surface-2); border:1px solid var(--border); color:var(--text-primary);
      width:36px; height:36px; border-radius:9px; flex:0 0 auto;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      transition:background .15s ease;
    }
    .mobile-menu-btn:hover{ background:var(--surface-3); }
    .mobile-topbar-logo{ width:26px; height:26px; border-radius:7px; object-fit:contain; flex:0 0 auto; }
    .mobile-topbar-title{ font-size:14.5px; font-weight:800; }

    .profile-fab{ top:13px; right:14px; width:34px; height:34px; }
    .profile-fab-avatar{ width:25px; height:25px; font-size:10px; }
    .profile-fab-ring{ inset:-4px; }

    .app-shell{ display:block; }

    .sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:210;
      width:250px !important; flex:0 0 250px !important;
      transform:translateX(-100%);
      transition:transform .25s cubic-bezier(.2,.8,.2,1);
      box-shadow:24px 0 60px -20px rgba(0,0,0,0.7);
    }
    .sidebar.mobile-open{ transform:translateX(0); }
    /* Neutralize the desktop "collapsed" (icon-only) state on mobile —
       there's no way to trigger it here since the Collapse button itself
       is hidden below, but this guards against a stale collapsed=true
       carried over from a desktop session on the same device. */
    .sidebar.collapsed{ width:250px !important; flex:0 0 250px !important; padding:20px 14px; }
    .sidebar.collapsed .brand{ justify-content:flex-start; padding:4px 10px 22px; }
    .sidebar.collapsed .nav-item{ justify-content:flex-start; padding:10px 12px; }
    .sidebar .desktop-only{ display:none; }

    .sidebar-backdrop{
      display:block; position:fixed; inset:0; z-index:200;
      background:rgba(6,6,9,0.6); backdrop-filter:blur(2px);
      animation:backdropIn .2s ease both;
    }

    .main{ padding:16px 16px 32px; max-width:100%; }
    .header-toolbar{ margin-bottom:18px; padding-bottom:14px; }
    .page-title{ font-size:19px; }
  }

  @media (max-width:480px){
    .main{ padding:14px 12px 26px; }
    .card{ padding:16px; }
    .page-title{ font-size:17.5px; }
    .drawer-body{ padding:16px 16px 8px; }
    .drawer-header, .drawer-actions{ padding-left:16px; padding-right:16px; }
  }

  /* Messages & notifications panel — on a phone/small-tablet screen the bell
     button can land anywhere inside the wrapping header toolbar, so a fixed-
     width panel anchored to it (the desktop behavior) can run off the edge
     of the screen. Below 640px it becomes a full-width bottom sheet instead,
     always centered on the viewport regardless of where the bell sits. */
  @media (max-width:640px){
    .message-panel{
      position:fixed; top:auto; bottom:0; left:0; right:0;
      width:100%; max-width:100%; max-height:82vh;
      border-radius:16px 16px 0 0;
      animation:messagePanelUpMobile .22s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes messagePanelUpMobile{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
    .message-conv-list, .message-thread{ max-height:none; }
  }

  @media (max-width:420px){
    .confirm-modal{ padding:20px 18px 18px; }
  }
</style>

// Where Supabase should send people back to after they click a signup-
// confirmation or password-reset link in their email. Inside the desktop
// app (see preload.js), this is a custom leadforge:// link the OS hands
// straight back to the installed app — no hosting required. In the plain
// web build it falls back to the current page's own URL, which only works
// once that page is hosted at a real https address Supabase is allowed to
// redirect to (a local file:// path can't be opened from a clicked email link).
function getAuthRedirectTo() {
  if (typeof window !== "undefined" && window.LEADFORGE_DESKTOP) {
    return "leadforge://reset";
  }
  return window.location.href.split("#")[0].split("?")[0];
}

// "Remember me" only ever remembers the email address typed into the login
// form (never the password) so it's prefilled next time — a small,
// non-sensitive convenience, not a security feature.
const REMEMBERED_EMAIL_KEY = "leadforge_remembered_email_v1";
function loadRememberedEmail() {
  try {
    return localStorage.getItem(REMEMBERED_EMAIL_KEY) || "";
  } catch (e) {
    return "";
  }
}
function saveRememberedEmail(email) {
  try {
    localStorage.setItem(REMEMBERED_EMAIL_KEY, email);
  } catch (e) {/* non-fatal */}
}
function clearRememberedEmail() {
  try {
    localStorage.removeItem(REMEMBERED_EMAIL_KEY);
  } catch (e) {/* non-fatal */}
}

/* ---------------------------------------------------------------------- */
/* Offline support — local cache of app data + a queue of writes that      */
/* couldn't reach Supabase yet, replayed automatically once back online.   */
/* ---------------------------------------------------------------------- */

function uuidv4() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  // Fallback UUID v4 generator for environments without crypto.randomUUID.
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === "x" ? r : r & 0x3 | 0x8;
    return v.toString(16);
  });
}
function isOnlineNow() {
  return typeof navigator === "undefined" || navigator.onLine !== false;
}

// A network-layer failure (offline, DNS, CORS-from-being-blocked, etc.) should
// be queued for later. A real database rejection (bad column, RLS violation,
// constraint) should surface to the user immediately instead of silently
// queuing forever — those won't fix themselves by retrying.
function isNetworkError(error) {
  if (!error) return false;
  const msg = String(error.message || error).toLowerCase();
  return msg.includes("fetch") || msg.includes("network") || msg.includes("failed to fetch") || msg.includes("load failed");
}

// Shared hook: live connectivity state + how many local changes are still
// waiting to reach Supabase. Mounted once at the app root; any component can
// use it to render a status indicator or to know whether to warn the user
// before an action that truly needs the network (like emailing a password
// reset link).
function useOfflineStatus() {
  const [online, setOnline] = useState(isOnlineNow());
  const [pending, setPending] = useState(() => getOfflineQueue().length);
  const [syncing, setSyncing] = useState(false);
  useEffect(() => {
    const unsub = subscribeOfflineQueue(q => setPending(q.length));
    function goOnline() {
      setOnline(true);
      setSyncing(true);
      flushOfflineQueue().finally(() => setSyncing(false));
    }
    function goOffline() {
      setOnline(false);
    }
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    // Catch cases where the browser never fires the event but we're actually
    // back (e.g. captive portal, flaky wifi) — a light periodic nudge.
    const retryTimer = setInterval(() => {
      if (isOnlineNow() && getOfflineQueue().length) {
        setSyncing(true);
        flushOfflineQueue().finally(() => setSyncing(false));
      }
    }, 20000);
    // Try once on mount in case there's already a queue from a previous session.
    if (isOnlineNow() && getOfflineQueue().length) {
      setSyncing(true);
      flushOfflineQueue().finally(() => setSyncing(false));
    }
    return () => {
      unsub();
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
      clearInterval(retryTimer);
    };
  }, []);

    online,
    pending,
    syncing
  };
}

// lands on the same palette color across devices/sessions instead of
// depending on insertion order (which can vary once creation happens
// automatically in more than one place).
function paletteColorForName(name) {
  const s = String(name || "");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % REP_PALETTE.length;
  return REP_PALETTE[Math.abs(h) % REP_PALETTE.length];
}

// There's no more manual "link this account to a rep" step — a Sales Rep
// account creates its own matching roster entry the moment it's needed, so
// it immediately shows up everywhere reps are used (pipeline dropdowns,
// Team Analytics, Business Units quotas, etc). The database trigger on
// signup (handle_new_user) normally does this already; this is a
// client-side fallback for accounts that predate that trigger, or that
// somehow still ended up unlinked. Runs against the live database directly
// (not React state) since it has to happen before loadAllData() has
// populated the reps list.
//
// IMPORTANT: only acts when the profile is NOT already linked. An Admin can
// relink an account to a different rep name at any time from User
// Management (e.g. to merge onto an existing roster entry) — this function
// must never overwrite that choice on the rep's next login.
async function ensureRepForProfile(profile) {
  if (profile.role !== "Sales Rep" || !isOnlineNow()) return profile;
  if ((profile.repName || "").trim()) return profile;
  const repName = (profile.name || "").trim();
  if (!repName) return profile;
  try {
    const {
      data: existing
    } = await sb.from("reps").select("id,name,deleted_at").ilike("name", repName).limit(1);
    let finalName = repName;
    if (!existing || !existing.length) {
      const {
        error: insErr
      } = await sb.from("reps").insert({
        id: uuidv4(),
        name: repName,
        color: paletteColorForName(repName)
      });
      if (insErr && !String(insErr.message || "").toLowerCase().includes("duplicate")) {
        console.warn("Could not auto-create rep:", insErr.message);
      }
    } else {
      finalName = existing[0].name;
      // The name matches a previously soft-deleted rep — reviving it (rather
      // than leaving it deleted) brings their existing leads/productivity
      // history straight back into every view, since none of that was ever
      // actually removed.
      if (existing[0].deleted_at) {
        await sb.from("reps").update({
          deleted_at: null
        }).eq("id", existing[0].id);
      }
    }
    await sb.from("profiles").update({
      rep_name: finalName
    }).eq("id", profile.id);
    return {
      ...profile,
      repName: finalName
    };
  } catch (e) {
    console.warn("ensureRepForProfile failed:", e.message);
    return profile;
  }
}

const TRASH_RETENTION_DAYS = 30;
function trashExpiresAt(deletedAtISO) {
  const d = new Date(deletedAtISO);
  if (isNaN(d.getTime())) return null;
  return new Date(d.getTime() + TRASH_RETENTION_DAYS * 24 * 60 * 60 * 1000);
}
function daysUntilPurge(deletedAtISO, now) {
  const exp = trashExpiresAt(deletedAtISO);
  if (!exp) return 0;
  return Math.max(0, Math.ceil((exp.getTime() - now) / (24 * 60 * 60 * 1000)));
}
function isExpiredTrash(lead, now) {
  if (!lead.deletedAt) return false;
  const exp = trashExpiresAt(lead.deletedAt);
  return exp ? now >= exp.getTime() : false;
}
function purgeExpiredTrash(leads) {
  const now = Date.now();
  return leads.filter(l => !isExpiredTrash(l, now));
}
